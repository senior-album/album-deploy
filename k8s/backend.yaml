apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: senior-album
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: senior-album
spec:
  replicas: 1
  # RWO PVC 라 롤링 업데이트 중 신구 파드가 동시에 볼륨을 잡으면 stuck 됨
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # T-004c: backend-secret 에 OPENSEARCH_* 키가 추가됐을 때 envFrom 만으로는
        # 기존 pod 가 옛 env 를 들고 살아있어 새 키를 픽업 못 한다. 이 annotation
        # revision 을 올리면 Deployment 의 pod template 해시가 바뀌어 ArgoCD sync
        # 시 rolling update 가 강제된다. backend-secret 의 OPENSEARCH_* 키를
        # 회전할 때마다 같이 올려야 함.
        # T-055: JWT rolling key 인프라 도입 — JWT_KEY_V1 / JWT_REFRESH_KEY_V1
        # envvar 매핑 추가에 맞춰 revision 갱신 (rollout 강제).
        # T-055-v2-add: JWT_KEY_V2 / JWT_REFRESH_KEY_V2 SealedSecret 추가 (Phase 1)
        # — envFrom 으로 자동 노출되지만 기존 pod 가 envvar 를 픽업 못 하므로
        # revision 갱신해서 rollout 강제. 활성 kid 전환은 Phase 2 에서.
        # T-055-v2-active: 활성 kid 를 v1 → v2 로 전환 (Phase 2). 신규 발급 토큰은
        # kid=v2 헤더로 서명되고, 옛 v1 / legacy 토큰은 keyset 에 둘 다 살아있어
        # 검증 그대로 통과 — 강제 로그아웃 없음. 14일 grace 후 Phase 4 에서 제거.
        album.io/secret-revision: "T-055-v2-active"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/senior-album/album-backend:247a308
          imagePullPolicy: Always
          env:
            - name: NO_ALBUMENTATIONS_UPDATE
              value: "1"
            # T-055: JWT 키 회전(rolling key) 인프라.
            # 첫 도입 단계 — 기존 backend-secret 의 JWT_SECRET / JWT_REFRESH_SECRET
            # 을 'v1' kid 로 한 번 더 노출한다. 결과 keyset = {v1: <기존값>,
            # legacy: <기존값>}. 새 토큰은 kid=v1 헤더로 발급되고, 기존 토큰은
            # 'legacy' fallback 으로 검증되므로 사용자 강제 로그아웃 없이 인프라만
            # 도입 완료. 진짜 첫 회전(새 secret 으로 v2 추가 → ACTIVE 전환 →
            # grace 후 v1/legacy 제거) 은 별도 PR + kubeseal reseal 단계로 분리.
            # 운영 절차: album-deploy/docs/JWT_KEY_ROTATION.md 참조.
            - name: JWT_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: JWT_REFRESH_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_REFRESH_SECRET
            # T-055-v2-active (Phase 2): 활성 kid v1 → v2.
            - name: JWT_ACTIVE_KID
              value: "v2"
            - name: JWT_REFRESH_ACTIVE_KID
              value: "v2"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: senior-album
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
