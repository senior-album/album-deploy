apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: senior-album
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: senior-album
spec:
  replicas: 1
  # RWO PVC 라 롤링 업데이트 중 신구 파드가 동시에 볼륨을 잡으면 stuck 됨
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # T-004c: backend-secret 에 OPENSEARCH_* 키가 추가됐을 때 envFrom 만으로는
        # 기존 pod 가 옛 env 를 들고 살아있어 새 키를 픽업 못 한다. 이 annotation
        # revision 을 올리면 Deployment 의 pod template 해시가 바뀌어 ArgoCD sync
        # 시 rolling update 가 강제된다. backend-secret 의 OPENSEARCH_* 키를
        # 회전할 때마다 같이 올려야 함.
        album.io/secret-revision: "T-004c"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/senior-album/album-backend:0325d07
          imagePullPolicy: Always
          env:
            - name: NO_ALBUMENTATIONS_UPDATE
              value: "1"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: senior-album
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
