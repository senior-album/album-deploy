---
# T-042: Grafana — Loki 쿼리 UI.
#
# 노출: 내부만. 외부 도메인(grafana.thekim123.info) 노출은 후속 (인증 정책 결정 후).
# 로컬 접근: kubectl -n senior-album port-forward svc/grafana 3000:3000 → localhost:3000
# admin 비밀번호: grafana-secret 의 ADMIN_PASSWORD (SealedSecret).
# 데이터소스: Loki 자동 등록 (provisioning).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: senior-album
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: senior-album
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        # T-127: uid 를 고정해 dashboard 패널이 환경 간 동일한 reference 로
        # 동작하도록. 미지정 시 grafana 가 random uid 를 발급해서 provisioned
        # dashboard 의 datasource binding 이 깨진다.
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          timeout: 60
          # T-122: Loki 로그 라인의 `trace_id` 필드를 Tempo trace 로 점프.
          # backend 의 LoggingInstrumentor 가 모든 로그에 trace_id 를 주입하므로
          # log → trace 양방향 네비게이션이 한 번의 클릭으로 완성된다.
          derivedFields:
            - name: trace_id
              matcherRegex: "\"trace_id\":\\s*\"([a-f0-9]+)\""
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: "Tempo 에서 보기"
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        # T-122: uid 고정 — Loki derivedFields 가 본 uid 를 참조해서 라우팅.
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # span 한 개 클릭 시 같은 trace_id 를 가진 Loki 로그 줄을 사이드 패널에
          # 띄움 — 한 요청의 trace + 로그 컨텍스트를 한 화면에서 본다.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            filterByTraceID: true
            customQuery: true
            query: '{namespace="senior-album"} |= "$${__trace.traceId}"'
          serviceMap:
            datasourceUid: ""
          search:
            hide: false
          nodeGraph:
            enabled: true
---
# T-127: dashboard provisioning provider — /etc/grafana/dashboards 의
# JSON 파일들을 자동 로드. ConfigMap (`grafana-dashboards`) 한 개에 dashboard
# 들을 모아두고 30초 간격으로 reload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: senior-album
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: senior-album
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: senior-album
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate              # PVC ReadWriteOnce
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        # T-122: grafana-datasources ConfigMap 에 Tempo datasource 추가됨 (provisioning
        # 은 grafana 기동 시 한 번만 읽힘). ArgoCD sync 가 ConfigMap 만 갱신하고
        # pod 재기동 안 하므로 본 annotation 으로 pod template 해시를 변경 → rollout 강제.
        # 이후 datasource 가 또 변경될 때 같이 올린다 (Loki secret 회전 패턴과 동일).
        album.io/datasources-revision: "T-122-tempo"
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # T-127: dashboard provisioner + dashboard JSON 들
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: senior-album
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
