---
# T-042: Loki single binary mode.
#
# 모드: single binary (모든 컴포넌트를 한 프로세스 — k3d 단일노드라 SSD/microservices 불필요).
# 스토리지: chunks/index 모두 MinIO 의 `loki` 버킷 (s3 호환 API). 로컬 PVC 는 boltdb-shipper
#          active index + WAL 만 (~5Gi 면 충분).
# Retention: 30일 (compactor 가 chunks 와 index 모두 정리). label 별 다중 retention 은
#            T-182 Phase 2 에서 추가.
# 의존성: `loki-secret` (MinIO loki 사용자 access/secret key), `minio` 서비스의 `loki` 버킷.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: senior-album
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: senior-album
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          endpoint: minio:9000
          bucketnames: loki
          access_key_id: ${LOKI_S3_ACCESS_KEY}
          secret_access_key: ${LOKI_S3_SECRET_KEY}
          s3forcepathstyle: true
          insecure: true
          http_config:
            insecure_skip_verify: true

    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 720h          # 30일 (T-182 §2-1 app log)
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_length: 721h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
      delete_request_store: s3

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: senior-album
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate              # PVC ReadWriteOnce — 두 pod 동시 마운트 불가
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true       # ${LOKI_S3_*} env 치환
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9095
              name: grpc
          env:
            - name: LOKI_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-secret
                  key: ACCESS_KEY
            - name: LOKI_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-secret
                  key: SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: senior-album
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9095
      targetPort: 9095
