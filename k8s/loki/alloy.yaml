---
# T-042: Grafana Alloy — DaemonSet 으로 노드의 모든 pod stdout 수집 → Loki push.
#
# Promtail 후속 (EOL 예고됨). Alloy 는 Prometheus / Loki / OpenTelemetry 통합 agent.
# 여기선 senior-album 네임스페이스 pod 의 stdout 만 스크랩 → Loki 의 `/loki/api/v1/push`.
#
# 라벨 매핑 (kubernetes pod labels → Loki labels):
#   namespace, app (pod label), pod, container, node
# PII redaction: backend 측 PIIRedactionFilter (T-103) 가 이미 처리. Alloy 단계에서 추가 X.
#
# T-127: 처리 파이프라인 추가 — 소스 → loki.process.parse → loki.write.
#   1) JSON 라인 (backend, T-123) 에서 `level` 추출해 라벨로 승격 (cardinality
#      ≤5 안전). `logger` 는 필드로만 (cardinality 폭발 방지).
#   2) 노이즈 drop:
#      - kubelet probe (UA `kube-probe/...`) → frontend nginx access 라인 제거
#      - uvicorn.access 의 GET/HEAD /health|/ready 200 응답 → backend probe 제거
#   비-JSON 라인 (postgres, redis, opensearch, minio 등) 은 stage.json 가
#   조용히 통과시키므로 그대로 흐른다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: senior-album
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-senior-album
rules:
  # pods/log: loki.source.kubernetes.pods 가 K8s API 로 로그를 tail 하므로 필수.
  # 빠지면 "forbidden ... pods/log" 반복되며 Loki 에 push 0 건.
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-senior-album
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-senior-album
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: senior-album
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: senior-album
data:
  config.alloy: |
    // Kubernetes pod 디스커버리
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // senior-album 네임스페이스 pod 만 + 라벨 정리
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "keep"
        regex         = "senior-album"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    // pod stdout 읽기 (K8s API 의 pods/log subresource 로 tail — ClusterRole 에 pods/log 필요)
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.parse.receiver]
    }

    // T-127: JSON parse + level 라벨 promote + 노이즈 drop
    loki.process "parse" {
      forward_to = [loki.write.default.receiver]

      // 1) backend JSON 라인에서 level / logger 추출.
      //    비-JSON 라인은 파싱 실패해도 stage 가 조용히 넘어간다 (라인 그대로 보존).
      stage.json {
        expressions = {
          level  = "level",
          logger = "logger",
        }
      }

      // 2) level 만 라벨로 승격. 값 ≤5 (DEBUG/INFO/WARNING/ERROR/CRITICAL) 라
      //    cardinality 안전. logger 는 필드로만 (LogQL 의 `| json` 으로 추출).
      stage.labels {
        values = {
          level = "",
        }
      }

      // 3) 노이즈 drop — kubelet probe (frontend nginx 가 UA 를 찍어줌).
      //    nginx access 포맷 끝에 `"kube-probe/<ver>"` 가 붙는다.
      stage.drop {
        expression          = "kube-probe/"
        drop_counter_reason = "noise_kube_probe"
      }

      // 4) 노이즈 drop — backend uvicorn.access 의 health/ready probe.
      //    JSON 한 줄 안의 escaped quote (`\"GET /health`) 를 그대로 매치한다.
      //    raw string (백틱) 안에서는 escape 처리 X — Go regexp 가 그대로 받는다.
      stage.drop {
        expression          = `\\"(?:GET|HEAD) /(?:health|ready)[^\\"]*\\" 2\d\d`
        drop_counter_reason = "noise_healthcheck"
      }
    }

    // Loki push
    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: senior-album
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
