apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: senior-album
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: senior-album-frontend:latest
          imagePullPolicy: Never  # k3d 로컬 이미지 사용
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: senior-album
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
