# MinIO 버킷을 별도 PVC 로 daily mirror.
#
# 이 1-pass 는 "같은 호스트 내 별도 PV" 로 mirror 해서 (a) 오브젝트
# 실수 삭제, (b) MinIO 데이터 corruption 에 대해 복구 경로를 제공한다.
# 맥미니 자체 장애에는 무력 — 그건 T-043(pg_dump→R2) 과 같이 외부
# 스토리지로 확장할 때 해결. 그 단계에선 이 CronJob 의 target alias 만
# R2 자격증명으로 바꾸면 됨.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-backup-pvc
  namespace: senior-album
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: senior-album
  labels:
    app: minio-backup
spec:
  # 매일 03:10 KST (UTC 18:10). MinIO 의 daily churn 이 끝난 새벽 기준.
  schedule: "10 18 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mc
              image: minio/mc:RELEASE.2024-11-21T17-21-54Z
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: MINIO_SECRET_KEY
                - name: BUCKET
                  value: "senior-album-photos"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mc alias set src http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mkdir -p "/backup/${BUCKET}"
                  echo "[$(date -u +%FT%TZ)] starting mirror src/${BUCKET} -> /backup/${BUCKET}"
                  mc mirror --overwrite --remove src/"${BUCKET}" "/backup/${BUCKET}"
                  echo "[$(date -u +%FT%TZ)] mirror done; size:"
                  du -sh "/backup/${BUCKET}"
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: minio-backup-pvc
