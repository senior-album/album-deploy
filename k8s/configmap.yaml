apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: senior-album
data:
  PROJECT_NAME: "Senior Album API"
  VERSION: "0.2.0"
  DEBUG: "False"

  # 데이터베이스 (k8s 서비스명 기준)
  # roadmap#87: 비밀번호는 SealedSecret 의 POSTGRES_PASSWORD 에. 부분 env 만 ConfigMap.
  # backend 가 런타임에 조립. (postgres-backup CronJob 도 동일 패턴)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "senior_album"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # JWT
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "10080"
  JWT_REFRESH_THRESHOLD_MINUTES: "1440"

  # 얼굴 인식
  FACE_SIMILARITY_THRESHOLD: "0.6"
  FACE_DETECTION_CONFIDENCE: "0.9"

  # OpenSearch
  OPENSEARCH_HOST: "opensearch"
  OPENSEARCH_PORT: "9200"

  # CORS
  # ⚠️ T-326: 라이브 값이 아직 placeholder 다 (실 도메인 thekim123.info 누락).
  # nginx 동일 출처라 현재는 안 터지지만 잠재 misconfig — 별도 후속에서 교체 검토.
  ALLOWED_ORIGINS: '["https://your-domain.com","http://localhost:5173"]'

  # MinIO (k8s 서비스명 기준)
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "senior-album-photos"
  MINIO_USE_SSL: "False"
  MINIO_EXTERNAL_ENDPOINT: "https://storage.thekim123.info"

  # 외부 URL
  FRONTEND_URL: "https://thekim123.info"
  API_BASE_URL: "https://thekim123.info/api"

  # 공유/보안
  SHARE_LINK_EXPIRE_HOURS: "72"
  LOGIN_MAX_ATTEMPTS: "5"
  LOGIN_LOCKOUT_MINUTES: "15"
  UPLOAD_DIR: "/app/uploads"
  # ⚠️ T-326: 라이브 값이 "create". Alembic 이 스키마를 관리하는데 DDL auto-create
  # 가 켜져 있음 — 위험 신호. 동작 영향 확인 후 별도 후속에서 "none" 전환 검토.
  DDL_AUTO: "create"

  # 카카오 OAuth
  KAKAO_REDIRECT_URI: "https://album.thekim123.info/auth/kakao/callback"

  # SMS 프로바이더 — log(개발·기본) | coolsms(프로덕션)
  # coolsms 사용 — backend-secret 에 COOLSMS_API_KEY / SECRET / FROM_NUMBER 주입됨.
  # 참고: album-backend/docs/COOLSMS_SETUP.md
  SMS_PROVIDER: "coolsms"

  # T-020: 운영자 (Senior Album) 부트스트랩.
  # 앱 시작 시 이 이메일로 가입한 활성 유저를 is_operator=True 로 자동 promote.
  OPERATOR_EMAIL: "kimyounghwan06271990@gmail.com"
