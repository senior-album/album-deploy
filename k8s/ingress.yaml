apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: senior-album-ingress
  namespace: senior-album
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # /api/* → 백엔드 (prefix 제거하고 전달)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # 그 외 → 프론트엔드
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
